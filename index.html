<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Tracker</title>
    <style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 15px;
    background-color: #eef1f5; /* Lighter grey background */
    color: #2c3e50; /* Darker text color for better contrast */
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 0.95em; /* Slightly smaller base font size */
}

h1 {
    color: #34495e; /* Dark blue-grey for heading */
    text-align: center;
    margin-bottom: 20px; /* Reduced margin */
    font-size: 1.8em; /* Slightly smaller h1 */
}

#crypto-container {
    width: 90%; /* Increased width for better use of space */
    max-width: 1200px; /* Increased max-width */
    background-color: #ffffff;
    padding: 15px; /* Reduced padding */
    border-radius: 6px; /* Slightly smaller border radius */
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08); /* Softer shadow */
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px; /* Reduced margin */
    font-size: 0.9em; /* Smaller font in table */
}

th, td {
    padding: 8px 10px; /* Reduced padding */
    border: 1px solid #e0e0e0; /* Lighter border */
    text-align: left;
    vertical-align: middle;
    white-space: nowrap; /* Prevent text wrapping in cells */
}

th {
    background-color: #3498db; /* Brighter blue for header */
    color: white;
    font-weight: 600; /* Slightly less bold */
    font-size: 0.95em;
}

tr:nth-child(even) {
    background-color: #f8f9fa; /* Lighter even row color */
}

tr:hover {
    background-color: #e9ecef; /* Subtler hover effect */
}

a {
    color: #2980b9; /* Adjusted link color */
    text-decoration: none;
    font-weight: 500;
}

a:hover {
    text-decoration: underline;
    color: #1f618d; /* Darker hover for link */
}

img {
    vertical-align: middle;
    width: 18px !important; /* Slightly smaller images */
    height: 18px !important;
    margin-right: 6px; /* Adjusted margin */
}

/* Responsive adjustments */
@media (max-width: 992px) { /* Adjusted breakpoint */
    #crypto-container {
        width: 95%;
    }
    th, td {
        padding: 7px 8px;
        font-size: 0.85em;
    }
    h1 {
        font-size: 1.6em;
    }
    img {
        width: 16px !important;
        height: 16px !important;
    }
}

@media (max-width: 768px) {
    body {
        padding: 10px;
        font-size: 0.9em;
    }
    #crypto-container {
        width: 100%;
        padding: 10px;
    }
    th, td {
        padding: 6px 5px; /* Further reduced padding */
        font-size: 0.8em;
    }
    img {
        width: 14px !important;
        height: 14px !important;
        margin-right: 4px;
    }
    /* Consider hiding less critical columns on very small screens if needed */
    .optional-column {
        /* display: none; */ /* Example: class to hide columns */
    }
}

@media (max-width: 480px) {
    th, td {
        font-size: 0.75em; /* Even smaller font for very small screens */
        padding: 5px 3px;
    }
    h1 {
        font-size: 1.4em;
    }
}
    </style>
</head>
<body>
    <h1>Crypto Tracker</h1>
    <div id="crypto-container">
        <!-- Crypto data will be loaded here by JavaScript -->
    </div>
    <script>
document.addEventListener('DOMContentLoaded', () => {
    const cryptoContainer = document.getElementById('crypto-container');
    const apiUrl = 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=200&page=1&sparkline=false';

    async function fetchCryptoData() {
        try {
            const response = await fetch(apiUrl);
            if (!response.ok) {
                throw new Error(`API request failed with status ${response.status}: ${response.statusText}`);
            }
            const coins = await response.json();
            displayCryptoData(coins);
        } catch (error) {
            console.error("Error fetching crypto data:", error);
            cryptoContainer.innerHTML = '<p>Error loading data. Please try again later.</p>';
        }
    }

    function displayCryptoData(coins) {
        cryptoContainer.innerHTML = ''; // Clear previous data or loading message

        if (!coins || coins.length === 0) {
            cryptoContainer.innerHTML = '<p>No cryptocurrency data available.</p>';
            return;
        }

        const table = document.createElement('table');
        const thead = document.createElement('thead');
        const tbody = document.createElement('tbody');

        // Create table header
        const headerRow = document.createElement('tr');
        const headers = ['Rank', 'Name', 'Symbol', 'Price (USD)', 'Market Cap (USD)', '24h Change (%)'];
        headers.forEach(headerText => {
            const th = document.createElement('th');
            th.textContent = headerText;
            headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);
        table.appendChild(thead);

        // Create table body
        coins.forEach((coin, index) => {
            const row = document.createElement('tr');

            const rankCell = document.createElement('td');
            rankCell.textContent = coin.market_cap_rank || (index + 1); // Use market_cap_rank if available

            const nameCell = document.createElement('td');
            const nameLink = document.createElement('a');
            nameLink.href = `https://www.coingecko.com/en/coins/${coin.id}`;
            nameLink.textContent = coin.name;
            nameLink.target = '_blank'; // Open in new tab
            nameCell.appendChild(nameLink);

            // Display coin image
            const image = document.createElement('img');
            image.src = coin.image;
            image.alt = coin.name;
            image.style.width = '20px';
            image.style.height = '20px';
            image.style.marginRight = '8px';
            nameCell.prepend(image);


            const symbolCell = document.createElement('td');
            symbolCell.textContent = coin.symbol.toUpperCase();

            const priceCell = document.createElement('td');
            priceCell.textContent = coin.current_price ? `$${coin.current_price.toLocaleString()}` : 'N/A';

            const marketCapCell = document.createElement('td');
            marketCapCell.textContent = coin.market_cap ? `$${coin.market_cap.toLocaleString()}` : 'N/A';

            const priceChange24hCell = document.createElement('td');
            const change = coin.price_change_percentage_24h;
            if (change != null) {
                priceChange24hCell.textContent = `${change.toFixed(2)}%`;
                priceChange24hCell.style.color = change >= 0 ? 'green' : 'red';
            } else {
                priceChange24hCell.textContent = 'N/A';
            }

            row.appendChild(rankCell);
            row.appendChild(nameCell);
            row.appendChild(symbolCell);
            row.appendChild(priceCell);
            row.appendChild(marketCapCell);
            row.appendChild(priceChange24hCell);
            tbody.appendChild(row);
        });

        table.appendChild(tbody);
        cryptoContainer.appendChild(table);
    }

    fetchCryptoData();
    // Refresh data every 20 seconds
    setInterval(fetchCryptoData, 20000);
});
    </script>
</body>
</html>
